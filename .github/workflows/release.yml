name: Release

# Builds SUS Fetcher.app on an Apple Silicon Mac and attaches it to a GitHub Release.
# Two triggers:
#  - push a vX.Y.Z tag
#  - Actions > Release > "Run workflow", entering the version (creates the tag and the Release)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v1.1.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # runner Apple Silicon
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! ./build-app.sh "${TAG}" 2>&1 | tee build.log; then
            # Surface compiler errors as GitHub annotations
            grep -E "error:" build.log | sed -E 's/^(.*)$/::error::\1/' | head -40
            exit 1
          fi

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "SUS Fetcher.app" "SUS-Fetcher-${TAG}.zip"
          shasum -a 256 "SUS-Fetcher-${TAG}.zip" | tee "SUS-Fetcher-${TAG}.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="build/SUS-Fetcher-${TAG}.zip"
          cat > notes.md <<'MD'
          ## Installation

          1. Download `SUS-Fetcher-*.zip`, unzip it and drag **SUS Fetcher.app** into `/Applications`.
          2. The app is ad-hoc signed (no Developer ID), so macOS blocks it on first launch.
             Remove the quarantine flag once:

             ```bash
             xattr -dr com.apple.quarantine "/Applications/SUS Fetcher.app"
             ```

          Apple Silicon, macOS 14 or later. — 🇫🇷 [Instructions en français](https://github.com/Matt-uSk/SUSFetcher/blob/main/README.fr.md#installation)
          MD
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
              --target "$GITHUB_SHA" \
              --title "SUS Fetcher ${TAG}" \
              --notes-file notes.md
          fi
