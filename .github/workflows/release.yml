name: Release

# Construit SUS Fetcher.app sur un Mac Apple Silicon et l'attache à une Release GitHub.
# Deux déclencheurs :
#  - pousser un tag vX.Y.Z
#  - Actions > Release > « Run workflow » en saisissant la version (crée le tag et la Release)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # runner Apple Silicon
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! ./build-app.sh "${TAG}" 2>&1 | tee build.log; then
            # Remonte les erreurs du compilateur en annotations GitHub
            grep -E "error:" build.log | sed -E 's/^(.*)$/::error::\1/' | head -40
            exit 1
          fi

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "SUS Fetcher.app" "SUS-Fetcher-${TAG}.zip"
          shasum -a 256 "SUS-Fetcher-${TAG}.zip" | tee "SUS-Fetcher-${TAG}.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="build/SUS-Fetcher-${TAG}.zip"
          cat > notes.md <<'MD'
          ## Installation

          1. Télécharger `SUS-Fetcher-*.zip`, le décompresser et glisser **SUS Fetcher.app** dans `/Applications`.
          2. L'app est signée ad-hoc (pas de Developer ID) : au premier lancement, macOS la bloque.
             Retirer la quarantaine une fois :

             ```bash
             xattr -dr com.apple.quarantine "/Applications/SUS Fetcher.app"
             ```

          Apple Silicon, macOS 14 ou plus récent.
          MD
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
              --target "$GITHUB_SHA" \
              --title "SUS Fetcher ${TAG}" \
              --notes-file notes.md
          fi
